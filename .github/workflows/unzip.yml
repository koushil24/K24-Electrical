name: Unzip site upload
on:
  push:
    paths: ['site.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          if [ ! -f site.zip ]; then exit 0; fi
          if [ -n "$ZIP_PASSWORD" ]; then unzip -o -P "$ZIP_PASSWORD" site.zip; else unzip -o site.zip; fi
          rm site.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site.zip" || echo "nothing to commit"
          git push
