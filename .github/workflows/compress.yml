name: Compress images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y imagemagick
          find images -name 'path-*.jpg' -exec mogrify -resize '800x800>' -quality 80 {} +
          find images \( -name 'hero-scene.jpg' -o -name 'power-strip.jpg' -o -name 'relay-panel.jpg' \) -exec mogrify -resize '1600x1600>' -quality 80 {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compress images" || echo "nothing to change"
          git push
